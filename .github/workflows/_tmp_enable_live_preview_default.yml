name: Temporary live preview default update

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/_tmp_enable_live_preview_default.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - name: Enable TAEH3 live preview in maintained workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/generate_workflows.py')
          text = path.read_text(encoding='utf-8')
          old = 'widgets=[False, "taeh3.safetensors", 768, 90, 1],'
          new = 'widgets=[True, "taeh3.safetensors", 768, 90, 1],'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one live-preview default, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python tools/generate_workflows.py
          rm .github/workflows/_tmp_enable_live_preview_default.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: enable live preview by default"
          git push origin HEAD:dev
