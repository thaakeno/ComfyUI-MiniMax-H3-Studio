name: Temporary prepare alpha.18 on dev

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/_tmp_prepare_alpha18.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - name: Prepare alpha.18 on dev
        shell: bash
        run: |
          uv run python tools/prepare_release.py .github/release-request.json
          rm .github/workflows/_tmp_prepare_alpha18.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): prepare 0.1.0-alpha.18"
          git push origin HEAD:dev
