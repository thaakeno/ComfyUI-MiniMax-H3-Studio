name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: uv sync --extra dev --locked
      - run: uv run pytest -q
      - run: uv run ruff check h3studio telemetry tests/backend tools --output-format=github
      - name: Frontend lint
        run: npm run lint
      - name: Frontend tests
        run: npm test
      - run: python tools/generate_workflows.py --check
      - run: python tools/validate_workflows.py
      - run: python tools/audit_nodes.py
      - run: python tools/release_check.py
