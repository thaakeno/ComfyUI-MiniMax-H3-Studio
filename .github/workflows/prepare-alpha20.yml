name: Prepare alpha20

on:
  push:
    branches:
      - release/alpha20

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/alpha20
      - run: python3 -m pip install --user uv
      - run: ~/.local/bin/uv run python tools/prepare_release.py .github/release-request.json
      - name: Commit prepared release metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock package.json h3studio/constants.py CHANGELOG.md README.md .github/release-request.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: prepare v0.1.0-alpha.20"
          git push origin HEAD:release/alpha20
