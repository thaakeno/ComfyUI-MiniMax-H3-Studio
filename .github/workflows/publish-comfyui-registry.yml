name: Publish to Comfy Registry

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish MiniMax H3 Studio
    runs-on: ubuntu-latest
    if: github.event.repository.fork == false
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install Comfy CLI
        run: python -m pip install --upgrade comfy-cli

      - name: Disable Comfy CLI telemetry
        run: comfy --skip-prompt --no-enable-telemetry env

      - name: Publish custom node
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: comfy node publish --token "$REGISTRY_ACCESS_TOKEN"
