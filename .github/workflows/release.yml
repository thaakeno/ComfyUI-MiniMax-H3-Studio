name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  archive:
    if: github.ref_type == 'tag' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare requested release
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          uv run python tools/prepare_release.py .github/release-request.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock package.json h3studio/constants.py CHANGELOG.md
          git commit -m "release: prepare $(python -c 'import json; print(json.load(open(".github/release-request.json"))["version"])')"
          git push origin HEAD:main

      - name: Resolve release tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            version="$(python -c 'import json; print(json.load(open(".github/release-request.json"))["version"])')"
            tag="v${version}"
          fi
          echo "RELEASE_TAG=${tag}" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - run: uv sync --extra dev --locked
      - run: npm run check
      - run: uv run pytest -q
      - run: python tools/release_check.py

      - name: Build tracked-source archive
        shell: bash
        run: |
          archive="ComfyUI-MiniMax-H3-Studio-${RELEASE_TAG}.zip"
          git archive --format=zip --prefix=ComfyUI-MiniMax-H3-Studio/ --output="$archive" HEAD
          sha256sum "$archive" > "$archive.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.RELEASE_SHA }}
          prerelease: ${{ contains(env.RELEASE_TAG, 'alpha') || contains(env.RELEASE_TAG, 'beta') || contains(env.RELEASE_TAG, 'rc') }}
          generate_release_notes: true
          files: |
            ComfyUI-MiniMax-H3-Studio-${{ env.RELEASE_TAG }}.zip
            ComfyUI-MiniMax-H3-Studio-${{ env.RELEASE_TAG }}.zip.sha256
