name: Refresh star history

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "docs/assets/star-history/**"
  watch:
    types: [started]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: star-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Normalize README embed markers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          prefix = "## Star history\n\nIf H3 Studio makes H3 less painful to use, leave a star.\n\n"
          note = "\n\n> [!NOTE]"
          if prefix not in text:
              raise SystemExit("README star-history section changed; refusing a blind rewrite")
          start = text.index(prefix) + len(prefix)
          end = text.index(note, start)
          block = """<div align=\"center\">\n<!-- star-history:start -->\n<!-- star-history:end -->\n</div>"""
          path.write_text(text[:start] + block + text[end:], encoding="utf-8")
          PY

      - uses: narayann7/star-history-action@v1
        with:
          repos: ${{ github.repository }}
          output-dir: docs/assets/star-history
          type: Date
          themes: light,dark
          width: 720
          update-readme: true
          readme: README.md
          readme-format: picture
          commit: ${{ github.ref_name == 'dev' }}
          commit-message: "docs: refresh star history chart [skip ci]"
