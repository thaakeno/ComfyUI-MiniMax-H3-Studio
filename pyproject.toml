[project]
name = "comfyui-minimax-h3-studio"
version = "0.1.0-alpha.20"
description = "A reference-aware MiniMax H3 still-image studio for ComfyUI"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "thaakeno" }]
keywords = ["comfyui", "minimax", "h3", "image-generation", "reference-image"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: GPU :: NVIDIA CUDA",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
vlm = [
  "transformers>=4.57.0",
  "accelerate>=1.1.0",
  "qwen-vl-utils>=0.0.14",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9",
]

[project.urls]
Repository = "https://github.com/thaakeno/ComfyUI-MiniMax-H3-Studio"
Issues = "https://github.com/thaakeno/ComfyUI-MiniMax-H3-Studio/issues"

[tool.comfy]
PublisherId = "thaakeno"
DisplayName = "MiniMax H3 Studio"
Icon = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["h3studio/nodes/image_runtime.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Integration/compatibility modules intentionally keep optional imports close to
# runtime branches, preserve wrappers with setattr/try-except semantics across
# multiple ComfyUI pins, and retain the project's Python-3.10-compatible typing
# surface. Keep exceptions file-scoped rather than weakening global lint policy.
"h3studio/analyzer_stack.py" = ["I001", "SIM105"]
"h3studio/comfy_attention_compat.py" = ["B010"]
"h3studio/comfy_compat.py" = ["SIM105", "SIM108"]
"h3studio/extension.py" = ["E402"]
"h3studio/face_refine/color.py" = ["UP035", "F401"]
"h3studio/face_refine/detector.py" = ["UP035", "UP006", "UP045"]
"h3studio/face_refine/geometry.py" = ["UP035", "UP006", "SIM108"]
"h3studio/face_refine/integration.py" = ["UP037", "I001", "F401", "B010"]
"h3studio/face_refine/masking.py" = ["UP045", "SIM105"]
"h3studio/face_refine/pipeline.py" = ["UP035", "UP006", "UP045"]
"h3studio/face_refine/sampling_bridge.py" = ["UP035", "UP045", "I001"]
"h3studio/nodes/face_refine_node.py" = ["UP035", "UP045", "UP006", "I001", "F841"]
"h3studio/nodes/prompt_prep_benchmark.py" = ["I001", "SIM105"]
"h3studio/qwen35_gguf.py" = ["I001"]
"h3studio/routing.py" = ["I001"]
"h3studio/runtime_web.py" = ["I001"]
"tests/backend/test_color_transfer.py" = ["F401"]
"tests/backend/test_crop_geometry.py" = ["F401"]
"tests/backend/test_face_detector.py" = ["F401"]
"tests/backend/test_lightx_v1.py" = ["F401"]
